<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pierre Serial</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: #0a0a0a;
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            margin: 0;
            overflow-x: hidden;
        }

        .container {
            width: calc(100% - 2rem);
            min-height: calc(100vh - 2rem);
            margin: 1rem;
            display: flex;
            flex-direction: column;
        }


        h1 {
            font-size: 1.5rem;
            margin-bottom: 1rem;
            font-weight: 600;
            color: #ffffff;
            text-align: center;
        }

        .main-card {
            background: #146e89;
            border: 2px solid #1a7fa0;
            box-shadow: 0 4px 20px rgba(20, 110, 137, 0.3);
            border-radius: 12px;
            padding: 1rem;
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            position: relative;
        }

        .connection-panel {
            background: #0f5670;
            border: 2px solid #146e89;
            border-radius: 8px;
            padding: 1rem;
            margin-bottom: 1rem;
            flex-shrink: 0;
        }

        .input-group {
            margin-bottom: 1rem;
        }

        label {
            display: block;
            margin-bottom: 0.5rem;
            color: rgba(255, 255, 255, 0.9);
            font-size: 0.9rem;
            font-weight: 500;
        }

        input {
            width: 100%;
            padding: 0.75rem;
            background: rgba(0, 0, 0, 0.3);
            border: 2px solid rgba(255, 255, 255, 0.2);
            border-radius: 6px;
            color: #ffffff;
            font-size: 0.875rem;
            transition: all 0.2s;
        }

        input:focus {
            outline: none;
            background: rgba(0, 0, 0, 0.5);
            border-color: rgba(255, 255, 255, 0.5);
            box-shadow: 0 0 0 3px rgba(255, 255, 255, 0.1);
        }

        .button-group {
            display: flex;
            gap: 1rem;
            flex-wrap: wrap;
        }

        button {
            flex: 1;
            min-width: 120px;
            padding: 0.75rem 1.5rem;
            background: #ffffff;
            color: #146e89;
            border: 2px solid #ffffff;
            border-radius: 6px;
            font-size: 0.875rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }

        button:hover {
            background: rgba(255, 255, 255, 0.9);
            transform: translateY(-1px);
        }

        button:active {
            transform: translateY(0);
        }

        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        .status-bar {
            background: #0f5670;
            border: 2px solid #146e89;
            border-radius: 8px;
            padding: 0.75rem;
            margin-bottom: 0.5rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 1rem;
            flex-shrink: 0;
        }

        .status {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            color: #ffffff;
        }

        .status-dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            animation: pulse 2s infinite;
        }

        .status-dot.connected {
            background: #4caf50;
            box-shadow: 0 0 10px #4caf50;
        }

        .status-dot.disconnected {
            background: #f44336;
            animation: none;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.7; transform: scale(0.9); }
        }

        .console {
            background: #1a1a1a;
            border: 3px solid #2a2a2a;
            border-radius: 8px;
            position: absolute;
            top: 60px;
            left: 0;
            right: 0;
            bottom: 0;
            overflow-y: auto;
            padding: 1rem;
            font-family: 'SF Mono', 'Monaco', 'Inconsolata', 'Fira Code', monospace;
            font-size: 0.875rem;
            line-height: 1.3;
            box-sizing: border-box;
            color: #e0e0e0;
        }

        .log-line {
            margin-bottom: 1px;
            padding: 2px 6px;
            border-radius: 3px;
            white-space: pre-wrap;
            word-wrap: break-word;
            animation: slideIn 0.3s;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateX(-20px);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        .log-line:hover {
            background: rgba(255, 255, 255, 0.05);
        }

        .log-line.error { color: #ff6b6b; }
        .log-line.success { color: #51cf66; }
        .log-line.warning { color: #ffd43b; }
        .log-line.info { color: #74c0fc; }

        /* App log styling - distinct from serial logs */
        .log-line.applog {
            background-color: rgba(100, 50, 200, 0.05);
            border-left: 3px solid #6432c8;
            padding-left: 10px;
            margin-left: 10px;
            font-style: italic;
            color: #a78bfa;
        }

        .no-data {
            text-align: center;
            padding: 3rem;
            color: #666;
            font-style: italic;
        }

        .control-buttons {
            display: flex;
            gap: 0.5rem;
            flex-wrap: wrap;
        }

        .control-buttons button {
            padding: 0.5rem 1rem;
            min-width: auto;
            flex: none;
            background: rgba(255, 255, 255, 0.9);
            color: #146e89;
            font-size: 0.75rem;
            border: 2px solid rgba(255, 255, 255, 0.9);
            font-weight: 700;
        }

        .control-buttons button:hover {
            background: #ffffff;
            border-color: #ffffff;
        }

        /* Flash custom firmware panel */
        .flash-panel {
            background: #0f5670;
            border: 2px solid #146e89;
            border-radius: 8px;
            padding: 0.75rem 1rem;
            margin-bottom: 1rem;
            flex-shrink: 0;
        }

        .flash-panel-title {
            font-size: 0.85rem;
            color: #ffffff;
            margin-bottom: 0.6rem;
            font-weight: 700;
            letter-spacing: 0.5px;
        }

        .flash-row {
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem;
            align-items: center;
        }

        .flash-row select,
        .flash-row input[type="file"] {
            flex: 1;
            min-width: 160px;
            padding: 0.45rem 0.6rem;
            background: #0a0a0a;
            border: 2px solid #1a7fa0;
            border-radius: 6px;
            color: #ffffff;
            font-family: inherit;
            font-size: 0.8rem;
        }

        .flash-row input[type="file"]::file-selector-button {
            background: rgba(255, 255, 255, 0.9);
            color: #146e89;
            border: none;
            border-radius: 4px;
            padding: 0.3rem 0.6rem;
            font-weight: 700;
            font-size: 0.75rem;
            margin-right: 0.5rem;
            cursor: pointer;
        }

        .flash-row button {
            flex: 0 0 auto;
            padding: 0.5rem 1rem;
            background: rgba(255, 255, 255, 0.9);
            color: #146e89;
            font-size: 0.75rem;
            border: 2px solid rgba(255, 255, 255, 0.9);
            border-radius: 6px;
            font-weight: 700;
            cursor: pointer;
        }

        .flash-row button:hover {
            background: #ffffff;
        }

        .flash-row button.cancel {
            background: #ff5252;
            color: #ffffff;
            border-color: #ff5252;
        }

        .flash-row button.cancel:hover {
            background: #ff1744;
            border-color: #ff1744;
        }

        .flash-progress-wrap {
            margin-top: 0.6rem;
            display: none;
        }

        .flash-progress-wrap.active {
            display: block;
        }

        .flash-progress-bar {
            width: 100%;
            height: 16px;
            background: #0a0a0a;
            border: 2px solid #1a7fa0;
            border-radius: 8px;
            overflow: hidden;
        }

        .flash-progress-fill {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #1a7fa0 0%, #4caf50 100%);
            transition: width 0.2s ease;
        }

        .flash-progress-text {
            font-size: 0.75rem;
            color: #ffffff;
            margin-top: 0.3rem;
            text-align: center;
        }



        #monitorPanel {
            flex: 1;
            position: relative;
            overflow: hidden;
            min-height: 0;
        }

        #connectionPanel {
            flex-shrink: 0;
        }

        /* Mobile responsive styles */
        @media (max-width: 768px) {
            .container {
                width: calc(100% - 1rem);
                min-height: calc(100vh - 1rem);
                margin: 0.5rem;
            }

            h1 {
                font-size: 1.2rem;
                margin-bottom: 0.5rem;
            }

            .main-card {
                padding: 0.75rem;
                border-radius: 8px;
                min-height: calc(100vh - 2rem);
            }

            .connection-panel {
                padding: 0.75rem;
            }

            .status-bar {
                padding: 0.5rem;
                flex-direction: column;
                gap: 0.75rem;
                align-items: stretch;
            }

            .status {
                font-size: 0.85rem;
                justify-content: center;
            }

            .control-buttons {
                width: 100%;
                justify-content: space-around;
            }

            .control-buttons button {
                padding: 0.4rem 0.6rem;
                font-size: 0.7rem;
                flex: 1;
                max-width: 80px;
            }


            .console {
                position: relative;
                top: auto;
                bottom: auto;
                left: auto;
                right: auto;
                margin: 0.5rem 0;
                padding: 0.5rem;
                font-size: 0.75rem;
                line-height: 1.2;
                flex: 1;
                min-height: 100px;
            }

            input {
                padding: 0.5rem;
                font-size: 0.875rem;
            }

            button {
                padding: 0.6rem 1rem;
                font-size: 0.875rem;
            }

            label {
                font-size: 0.85rem;
            }

            #deviceInfo {
                font-size: 0.75rem;
                display: block;
                text-align: center;
                margin-top: 0.25rem;
            }

            #messageCount {
                display: block;
                text-align: center;
                margin-top: 0.25rem;
            }

            #monitorPanel {
                display: flex !important;
                flex-direction: column;
                height: 100%;
            }

            .status-bar {
                flex-shrink: 0;
            }

            .console {
                flex: 1;
                overflow-y: auto;
            }
        }

        /* Very small screens */
        @media (max-width: 380px) {
            .control-buttons button {
                padding: 0.3rem 0.4rem;
                font-size: 0.65rem;
                max-width: 70px;
            }

            h1 {
                font-size: 1rem;
            }
        }

    </style>
</head>
<body>
    <div class="container">
        <div class="main-card">
            <h1>Pierre Serial</h1>
            <div class="connection-panel" id="connectionPanel">
                <h2 style="margin-bottom: 1rem; color: #ffffff;">Connect to Live Stream</h2>

                <div class="input-group">
                    <label for="deviceId">Device ID (from Android app)</label>
                    <input type="text" id="deviceId" placeholder="e.g., abc123def456">
                </div>

                <div class="input-group">
                    <label for="sessionId">Session ID (from Android app)</label>
                    <input type="text" id="sessionId" placeholder="e.g., 12345678">
                </div>

                <div class="button-group">
                    <button onclick="connectToMQTT()" id="connectBtn">Connect to Live Stream</button>
                </div>

                <div style="margin-top: 1rem; padding: 1rem; background: #1a1a1a; border-radius: 8px;">
                    <p style="color: #888; font-size: 0.85rem;">
                        <strong>Tip:</strong> Get these IDs from the Pierre Flasher app on your Android device.
                        Click the green Live Share button in Serial Monitor to copy the share URL.
                    </p>
                </div>
            </div>

            <div id="monitorPanel" style="display: none;">
                <div class="status-bar">
                    <div class="status">
                        <div id="statusDot" class="status-dot disconnected"></div>
                        <span id="statusText">Disconnected</span>
                        <span id="deviceInfo" style="color: #ffffff; margin-left: 1rem;"></span>
                        <span id="messageCount" style="color: #666; margin-left: 1rem;">0 messages</span>
                        <span id="connTime" style="color: #999; margin-left: 1rem;">-</span>
                    </div>
                    <div class="control-buttons">
                        <button onclick="clearLogs()">Clear</button>
                        <button onclick="resetPierre()">Reset Pierre</button>
                        <button onclick="startSerialMonitor()">Start Serial Monitor</button>
                        <button onclick="toggleAutoScroll()" id="autoScrollBtn">Auto Scroll: ON</button>
                        <button onclick="downloadLogs()">Download</button>
                    </div>
                </div>

                <div class="flash-panel">
                    <div class="flash-panel-title">⚡ FLASH CUSTOM FIRMWARE</div>
                    <div class="flash-row">
                        <select id="fwSlot">
                            <option value="production" selected>Production (0x10000)</option>
                            <option value="bootloader">Bootloader (0x1000)</option>
                            <option value="partition_table">Partition Table (0x8000)</option>
                            <option value="ota_data">OTA Data (0xE000)</option>
                        </select>
                        <input type="file" id="fwFile" accept=".bin">
                        <button id="fwFlashBtn" onclick="uploadAndFlashFirmware()">Upload &amp; Flash</button>
                        <button id="fwCancelBtn" class="cancel" onclick="cancelFirmwareUpload()" style="display:none;">Cancel</button>
                    </div>
                    <div class="flash-progress-wrap" id="fwProgressWrap">
                        <div class="flash-progress-bar">
                            <div class="flash-progress-fill" id="fwProgressFill"></div>
                        </div>
                        <div class="flash-progress-text" id="fwProgressText">Preparing...</div>
                    </div>
                </div>

                <div class="console" id="console">
                    <div class="no-data">Waiting for serial data...</div>
                </div>

            </div>
        </div>
    </div>

    <!-- Version number in bottom left corner -->
    <div style="position: fixed; bottom: 10px; left: 10px; background: #000; color: #fff; padding: 4px 8px; border-radius: 4px; font-size: 0.75rem; font-family: monospace; z-index: 1000; border: 1px solid #333;">
        v1.2.0
    </div>

    <!-- MQTT.js from CDN -->
    <script src="https://unpkg.com/mqtt@4.3.7/dist/mqtt.min.js"></script>
    <!-- AnsiUp for ANSI color support -->
    <script src="https://cdn.jsdelivr.net/npm/ansi_up@5.1.0/ansi_up.min.js"></script>

    <script>
        // HiveMQ Configuration
        const MQTT_CONFIG = {
            broker: 'wss://0c1bf62a21e94682adf340b8a2d3fe04.s1.eu.hivemq.cloud:8884/mqtt',
            username: 'pierreflasher',
            password: 'Pierre2k23',
            topicPrefix: 'pierre/serial'
        };

        // State
        let client = null;
        let messageCount = 0;
        let autoScroll = true;
        let logs = [];
        let connectionTime = null;
        let lastHeartbeat = null;
        let heartbeatCheckInterval = null;

        // Initialize AnsiUp for ANSI color support
        let ansiUp;
        try {
            ansiUp = new AnsiUp.default();
        } catch (e) {
            console.log('AnsiUp initialization failed, trying alternative:', e);
            // Try alternative initialization
            if (typeof AnsiUp !== 'undefined') {
                ansiUp = new AnsiUp();
            }
        }

        // Check URL parameters
        window.addEventListener('DOMContentLoaded', () => {
            const urlParams = new URLSearchParams(window.location.search);
            const device = urlParams.get('device');
            const session = urlParams.get('session');

            console.log('URL params check:', { device, session });

            if (device && session) {
                console.log('Auto-connecting with:', device, session);
                document.getElementById('deviceId').value = device;
                document.getElementById('sessionId').value = session;
                // Auto-connect after a short delay
                setTimeout(() => {
                    console.log('Triggering auto-connect...');
                    connectToMQTT();
                }, 500);
            }
        });

        function connectToMQTT() {
            const deviceId = document.getElementById('deviceId').value.trim();
            const sessionId = document.getElementById('sessionId').value.trim();

            if (!deviceId || !sessionId) {
                alert('Please enter both Device ID and Session ID');
                return;
            }

            // Update button
            const connectBtn = document.getElementById('connectBtn');
            connectBtn.disabled = true;
            connectBtn.textContent = 'Connecting...';

            // Prepare connection
            const topic = `${MQTT_CONFIG.topicPrefix}/${deviceId}/${sessionId}`;
            const clientId = 'web_' + Date.now() + '_' + Math.random().toString(36).substring(2, 9);

            // Update UI
            updateStatus('Connecting...', false);

            // Create MQTT client
            client = mqtt.connect(MQTT_CONFIG.broker, {
                clientId: clientId,
                username: MQTT_CONFIG.username,
                password: MQTT_CONFIG.password,
                clean: true,
                connectTimeout: 30000,
                reconnectPeriod: 1000,
                keepalive: 60
            });

            // Connection successful
            client.on('connect', () => {
                console.log('Connected to HiveMQ Cloud');
                connectionTime = new Date();
                updateConnectionTime();

                // Update UI
                document.getElementById('connectionPanel').style.display = 'none';
                document.getElementById('monitorPanel').style.display = 'block';
                updateStatus('Waiting for device...', true);

                // Subscribe to main topic
                client.subscribe(topic, { qos: 0 }, (err) => {
                    if (err) {
                        console.error('Subscribe error:', err);
                        addLog('Failed to subscribe: ' + err.message, 'error');
                    } else {
                        console.log('Subscribed to:', topic);
                        addLog('Connected to HiveMQ Cloud', 'success');
                        addLog(`Monitoring: ${deviceId}/${sessionId}`, 'info');
                        addLog('Waiting for serial data...', 'info');
                    }
                });

                // Subscribe to device info topic
                const infoTopic = `${MQTT_CONFIG.topicPrefix}/${deviceId}/${sessionId}/info`;
                client.subscribe(infoTopic, { qos: 0 }, (err) => {
                    if (err) {
                        console.error('Info subscribe error:', err);
                    } else {
                        console.log('Subscribed to device info:', infoTopic);
                    }
                });

                // Subscribe to status topic
                const statusTopic = `${MQTT_CONFIG.topicPrefix}/${deviceId}/${sessionId}/status`;
                client.subscribe(statusTopic, { qos: 0 }, (err) => {
                    if (err) {
                        console.error('Status subscribe error:', err);
                    } else {
                        console.log('Subscribed to device status:', statusTopic);
                        addLog(`Monitoring status: ${statusTopic}`, 'info');
                    }
                });

                // Subscribe to app logs topic
                const appLogTopic = `${MQTT_CONFIG.topicPrefix}/${deviceId}/${sessionId}/applog`;
                client.subscribe(appLogTopic, { qos: 0 }, (err) => {
                    if (err) {
                        console.error('App log subscribe error:', err);
                    } else {
                        console.log('Subscribed to app logs:', appLogTopic);
                    }
                });

                // Subscribe to firmware upload progress topic
                const fwProgressTopic = `pierre/firmware/${deviceId}/${sessionId}/progress`;
                client.subscribe(fwProgressTopic, { qos: 0 }, (err) => {
                    if (err) {
                        console.error('Firmware progress subscribe error:', err);
                    } else {
                        console.log('Subscribed to firmware progress:', fwProgressTopic);
                    }
                });

                // Reset button
                connectBtn.disabled = false;
                connectBtn.textContent = 'Connect to Live Stream';
            });

            // Handle incoming messages
            client.on('message', (topic, payload) => {
                const message = payload.toString();

                // Firmware upload progress messages from the phone
                if (topic.startsWith('pierre/firmware/') && topic.endsWith('/progress')) {
                    handleFirmwareProgressMessage(message);
                    return;
                }

                // Check message type based on topic ending
                if (topic.endsWith('/status')) {
                    // Handle status message
                    console.log('Status message received:', message);
                    if (message === 'connected') {
                        lastHeartbeat = Date.now();
                        updateStatus('Device Online', true);

                        // Start heartbeat monitoring if not already started
                        if (!heartbeatCheckInterval) {
                            heartbeatCheckInterval = setInterval(() => {
                                if (lastHeartbeat && (Date.now() - lastHeartbeat > 25000)) {
                                    // No heartbeat for 25 seconds, consider device offline
                                    updateStatus('Device Offline', false);
                                    addLog('📱 Android app disconnected (timeout)', 'error');
                                    document.getElementById('deviceInfo').textContent = '';
                                    lastHeartbeat = null;
                                }
                            }, 5000); // Check every 5 seconds

                            addLog('📱 Android app connected', 'success');
                        }
                    } else if (message === 'disconnected') {
                        updateStatus('Device Offline', false);
                        addLog('📱 Android app disconnected', 'error');
                        // Clear device info when disconnected
                        document.getElementById('deviceInfo').textContent = '';
                        lastHeartbeat = null;
                    } else if (message === '') {
                        // Empty message means retained clear
                        console.log('Retained status cleared');
                    } else {
                        addLog(`Unknown status: ${message}`, 'warning');
                    }
                } else if (topic.endsWith('/info')) {
                    // Parse device info format: "deviceName|batteryPct"
                    const parts = message.split('|');
                    if (parts.length === 2) {
                        const deviceName = parts[0];
                        const batteryPct = parts[1];

                        // Update device info display
                        const deviceInfoEl = document.getElementById('deviceInfo');
                        if (batteryPct !== '-1') {
                            deviceInfoEl.textContent = `| ${deviceName} (${batteryPct}% Battery)`;
                        } else {
                            deviceInfoEl.textContent = `| ${deviceName}`;
                        }
                    }
                } else if (topic.endsWith('/applog')) {
                    // App log message - display with different style
                    addLog(message, 'applog');
                    messageCount++;
                    document.getElementById('messageCount').textContent = `${messageCount} messages`;
                } else {
                    // Regular serial data message
                    addLog(message);
                    messageCount++;
                    document.getElementById('messageCount').textContent = `${messageCount} messages`;
                }
            });

            // Connection error
            client.on('error', (err) => {
                console.error('Connection error:', err);
                updateStatus('Error', false);
                addLog('Connection error: ' + err.message, 'error');

                // Reset button
                connectBtn.disabled = false;
                connectBtn.textContent = 'Connect to Live Stream';
            });

            // Connection lost
            client.on('offline', () => {
                updateStatus('Offline', false);
            });

            // Reconnecting
            client.on('reconnect', () => {
                updateStatus('Reconnecting...', false);
            });
        }


        function addLog(message, type = '') {
            const console = document.getElementById('console');

            // Remove "no data" message
            const noData = console.querySelector('.no-data');
            if (noData) {
                noData.remove();
            }

            // Create log line
            const logLine = document.createElement('div');
            logLine.className = 'log-line';
            if (type) {
                logLine.classList.add(type);
            }

            // Convert ANSI codes to HTML if ansiUp is available
            let htmlMessage = message;
            if (ansiUp && ansiUp.ansi_to_html) {
                try {
                    htmlMessage = ansiUp.ansi_to_html(message);
                } catch (e) {
                    console.log('ANSI conversion failed:', e);
                    htmlMessage = message;
                }
            }

            // Set the content (no timestamp)
            logLine.innerHTML = htmlMessage;

            // Auto-detect type only if no ANSI colors and no type specified
            if (!type && !message.includes('\x1b[')) {
                if (message.includes('ERROR')) {
                    logLine.classList.add('error');
                } else if (message.includes('SUCCESS')) {
                    logLine.classList.add('success');
                } else if (message.includes('WARNING')) {
                    logLine.classList.add('warning');
                } else if (message.includes('INFO')) {
                    logLine.classList.add('info');
                }
            }

            console.appendChild(logLine);
            logs.push(message); // Store raw message without timestamp

            // Auto-scroll
            if (autoScroll) {
                console.scrollTop = console.scrollHeight;
            }
        }

        function clearLogs() {
            const console = document.getElementById('console');
            console.innerHTML = '<div class="no-data">Waiting for serial data...</div>';
            logs = [];
        }

        function toggleAutoScroll() {
            autoScroll = !autoScroll;
            const btn = document.getElementById('autoScrollBtn');
            btn.textContent = `Auto Scroll: ${autoScroll ? 'ON' : 'OFF'}`;

            if (autoScroll) {
                const console = document.getElementById('console');
                console.scrollTop = console.scrollHeight;
            }
        }

        function downloadLogs() {
            if (logs.length === 0) {
                alert('No logs to download');
                return;
            }

            const timestamp = new Date().toISOString().replace(/[:.]/g, '-');
            const filename = `serial_logs_${timestamp}.txt`;
            const content = logs.join('\n');

            const blob = new Blob([content], { type: 'text/plain' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = filename;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        }

        function updateStatus(text, connected) {
            document.getElementById('statusText').textContent = text;
            const dot = document.getElementById('statusDot');

            if (connected) {
                dot.classList.remove('disconnected');
                dot.classList.add('connected');
            } else {
                dot.classList.remove('connected');
                dot.classList.add('disconnected');
            }
        }

        function updateConnectionTime() {
            if (!connectionTime) return;

            const now = new Date();
            const diff = Math.floor((now - connectionTime) / 1000);
            const hours = Math.floor(diff / 3600);
            const minutes = Math.floor((diff % 3600) / 60);
            const seconds = diff % 60;

            let timeStr = '';
            if (hours > 0) timeStr += `${hours}h `;
            if (minutes > 0) timeStr += `${minutes}m `;
            timeStr += `${seconds}s`;

            document.getElementById('connTime').textContent = timeStr;
        }

        // Update connection time every second
        setInterval(updateConnectionTime, 1000);

        function resetPierre() {
            console.log('🔄 Reset Pierre button clicked!');

            if (!client) {
                console.log('❌ No MQTT client connection');
                addLog('❌ Not connected to MQTT broker', 'error');
                alert('Not connected to device');
                return;
            }

            const deviceId = document.getElementById('deviceId').value.trim();
            const sessionId = document.getElementById('sessionId').value.trim();

            console.log('📍 Device ID:', deviceId);
            console.log('📍 Session ID:', sessionId);

            if (!deviceId || !sessionId) {
                console.log('❌ Missing Device ID or Session ID');
                addLog('❌ Device or session ID missing', 'error');
                alert('Device or session ID missing');
                return;
            }

            // Send reset command via control topic - Android app now listens to this!
            const controlTopic = `${MQTT_CONFIG.topicPrefix}/${deviceId}/${sessionId}/control`;
            const resetCommand = JSON.stringify({ command: 'reset_controller' });

            console.log('📡 Sending MQTT reset command to topic:', controlTopic);
            console.log('📡 Command payload:', resetCommand);

            client.publish(controlTopic, resetCommand, { qos: 1 }, (err) => {
                if (err) {
                    console.error('❌ Reset command error:', err);
                    addLog('❌ Failed to send reset command: ' + err.message, 'error');
                } else {
                    console.log('✅ Reset command sent successfully');
                    addLog('✅ RESET COMMAND SENT', 'success');
                }
            });
        }

        function startSerialMonitor() {
            console.log('📟 Start Serial Monitor button clicked!');

            if (!client) {
                console.log('❌ No MQTT client connection');
                addLog('❌ Not connected to MQTT broker', 'error');
                alert('Not connected to device');
                return;
            }

            const deviceId = document.getElementById('deviceId').value.trim();
            const sessionId = document.getElementById('sessionId').value.trim();

            console.log('📍 Device ID:', deviceId);
            console.log('📍 Session ID:', sessionId);

            if (!deviceId || !sessionId) {
                console.log('❌ Missing Device ID or Session ID');
                addLog('❌ Device or session ID missing', 'error');
                alert('Device or session ID missing');
                return;
            }

            const topic = `pierre/commands/${deviceId}/${sessionId}/serial_monitor`;
            const message = JSON.stringify({
                command: 'start_serial_monitor',
                timestamp: Date.now()
            });

            console.log('📤 Publishing to topic:', topic);
            console.log('📤 Message:', message);

            try {
                client.publish(topic, message);
                console.log('✅ Serial monitor command sent successfully');
                addLog('✅ Serial monitor command sent to device', 'success');
            } catch (error) {
                console.error('❌ Failed to send command:', error);
                addLog(`❌ Failed to send command: ${error}`, 'error');
            }
        }

        // =====================================================================
        // Custom firmware upload over MQTT
        // =====================================================================
        // We send the .bin file in small chunks on pierre/firmware/{device}/{session}/chunk,
        // bracketed by /start and /end messages. The phone writes the chunks into a cache
        // file and, once /end arrives, triggers its existing custom-firmware flash path.
        // The phone publishes progress updates back on /progress, which we render here.

        const FW_CHUNK_SIZE = 32 * 1024; // 32 KB per chunk (~44 KB base64, well under HiveMQ free limits)
        const FW_CHUNK_DELAY_MS = 40;    // Pause between chunks to give the broker a break
        let fwUploadState = null;         // { file, slot, totalChunks, buffer, cancelled }

        function setFwProgress(percent, text) {
            const wrap = document.getElementById('fwProgressWrap');
            const fill = document.getElementById('fwProgressFill');
            const txt = document.getElementById('fwProgressText');
            wrap.classList.add('active');
            fill.style.width = `${Math.max(0, Math.min(100, percent))}%`;
            if (text !== undefined) txt.textContent = text;
        }

        function hideFwProgress() {
            document.getElementById('fwProgressWrap').classList.remove('active');
            document.getElementById('fwProgressFill').style.width = '0%';
            document.getElementById('fwProgressText').textContent = '';
        }

        function setFwUploading(isUploading) {
            document.getElementById('fwFlashBtn').style.display = isUploading ? 'none' : '';
            document.getElementById('fwCancelBtn').style.display = isUploading ? '' : 'none';
            document.getElementById('fwFile').disabled = isUploading;
            document.getElementById('fwSlot').disabled = isUploading;
        }

        function arrayBufferToBase64(buffer) {
            // Convert a Uint8Array/ArrayBuffer slice to base64 in a way that works in all browsers.
            let binary = '';
            const bytes = buffer instanceof Uint8Array ? buffer : new Uint8Array(buffer);
            const chunk = 0x8000;
            for (let i = 0; i < bytes.length; i += chunk) {
                binary += String.fromCharCode.apply(null, bytes.subarray(i, i + chunk));
            }
            return btoa(binary);
        }

        async function uploadAndFlashFirmware() {
            if (!client || !client.connected) {
                alert('Not connected to device');
                return;
            }
            const fileInput = document.getElementById('fwFile');
            if (!fileInput.files || fileInput.files.length === 0) {
                alert('Please choose a .bin file first');
                return;
            }
            const file = fileInput.files[0];
            if (!file.name.toLowerCase().endsWith('.bin')) {
                if (!confirm(`"${file.name}" does not look like a .bin file. Upload anyway?`)) return;
            }
            const slot = document.getElementById('fwSlot').value;

            const deviceId = document.getElementById('deviceId').value.trim();
            const sessionId = document.getElementById('sessionId').value.trim();
            if (!deviceId || !sessionId) {
                alert('Device or session ID missing');
                return;
            }

            const buffer = new Uint8Array(await file.arrayBuffer());
            const totalChunks = Math.ceil(buffer.length / FW_CHUNK_SIZE);

            fwUploadState = {
                file, slot, totalChunks, buffer,
                cancelled: false,
                deviceId, sessionId,
            };

            setFwUploading(true);
            setFwProgress(0, `Uploading ${file.name} (${(buffer.length / 1024).toFixed(0)} KB, ${totalChunks} chunks)...`);
            addLog(`📤 Uploading firmware: ${file.name} (${buffer.length} bytes) to slot "${slot}"`, 'info');

            const base = `pierre/firmware/${deviceId}/${sessionId}`;

            // Start message
            const startPayload = JSON.stringify({
                filename: file.name,
                size: buffer.length,
                chunks: totalChunks,
                slot: slot,
            });
            await new Promise((resolve) => {
                client.publish(`${base}/start`, startPayload, { qos: 1 }, (err) => {
                    if (err) addLog(`❌ Failed to send start: ${err.message}`, 'error');
                    resolve();
                });
            });

            // Chunks
            for (let i = 0; i < totalChunks; i++) {
                if (fwUploadState && fwUploadState.cancelled) {
                    addLog('✖ Upload cancelled', 'warning');
                    client.publish(`${base}/abort`, '{}', { qos: 1 });
                    setFwUploading(false);
                    hideFwProgress();
                    fwUploadState = null;
                    return;
                }
                const start = i * FW_CHUNK_SIZE;
                const end = Math.min(start + FW_CHUNK_SIZE, buffer.length);
                const slice = buffer.subarray(start, end);
                const b64 = arrayBufferToBase64(slice);
                const chunkPayload = JSON.stringify({
                    index: i,
                    offset: start,
                    data: b64,
                });

                await new Promise((resolve, reject) => {
                    client.publish(`${base}/chunk`, chunkPayload, { qos: 1 }, (err) => {
                        if (err) reject(err); else resolve();
                    });
                });

                const pct = Math.floor(((i + 1) / totalChunks) * 90); // up to 90% for upload, last 10% for flash
                setFwProgress(pct, `Uploading chunk ${i + 1}/${totalChunks}`);
                if (FW_CHUNK_DELAY_MS > 0) await new Promise(r => setTimeout(r, FW_CHUNK_DELAY_MS));
            }

            // End message
            await new Promise((resolve) => {
                client.publish(`${base}/end`, '{}', { qos: 1 }, (err) => {
                    if (err) addLog(`❌ Failed to send end: ${err.message}`, 'error');
                    resolve();
                });
            });

            setFwProgress(92, 'Upload complete, waiting for phone to flash...');
            addLog('✅ Upload complete, waiting for flasher to start...', 'success');
            // Don't flip setFwUploading(false) yet — wait for progress="done" from the phone.
        }

        function cancelFirmwareUpload() {
            if (fwUploadState) {
                fwUploadState.cancelled = true;
            }
        }

        function handleFirmwareProgressMessage(payloadStr) {
            let msg;
            try {
                msg = JSON.parse(payloadStr);
            } catch (e) {
                console.warn('Invalid firmware progress payload:', payloadStr);
                return;
            }
            const status = msg.status || '';
            const received = msg.received || 0;
            const total = msg.total || 0;
            const extra = msg.message ? ` — ${msg.message}` : '';
            switch (status) {
                case 'uploading': {
                    if (total > 0) {
                        const pct = Math.floor((received / total) * 90);
                        setFwProgress(pct, `Phone received ${received}/${total} chunks${extra}`);
                    }
                    break;
                }
                case 'ready':
                    setFwProgress(92, `Upload received by phone${extra}`);
                    addLog(`📦 Phone has full firmware${extra}`, 'info');
                    break;
                case 'flashing':
                    setFwProgress(95, `Flashing ESP32${extra}`);
                    addLog(`⚡ ESP32 flash in progress${extra}`, 'info');
                    break;
                case 'done':
                    setFwProgress(100, `Flash complete${extra}`);
                    addLog(`🎉 Flash complete${extra}`, 'success');
                    setFwUploading(false);
                    fwUploadState = null;
                    setTimeout(hideFwProgress, 4000);
                    break;
                case 'error':
                    addLog(`❌ Flash error${extra}`, 'error');
                    setFwProgress(100, `Error${extra}`);
                    setFwUploading(false);
                    fwUploadState = null;
                    setTimeout(hideFwProgress, 6000);
                    break;
                case 'aborted':
                    addLog(`✖ Upload aborted by phone${extra}`, 'warning');
                    setFwUploading(false);
                    fwUploadState = null;
                    hideFwProgress();
                    break;
                default:
                    console.log('Unknown firmware progress status:', status, msg);
            }
        }

        // Clean up on page unload
        window.addEventListener('beforeunload', () => {
            if (client) {
                client.end();
            }
        });
    </script>
</body>
</html>
